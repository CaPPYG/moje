# GarcArzP HUB - zjednotena Nginx reverse proxy konfiguracia
# Doména: garcarzp.online / www.garcarzp.online / 35.209.172.238
#
# Routovanie:
#   /            -> HUB dashboard (staticky index.html v /home/patrik/server)
#   /solar/      -> projekt Solar (Flask/Gunicorn na 127.0.0.1:8000)
#   /cappytools/ -> projekt CappyTools (Flask na 127.0.0.1:5000)
#   /drive/      -> projekt Drive Drop (Flask na 127.0.0.1:5050)
#   /paste/      -> projekt PasteBin (Flask na 127.0.0.1:5060)
#   /p/          -> skratene URL pre zobrazenie paste (127.0.0.1:5060)
#
# ESP endpoint /solar/api/esp/battery je VZDY dostupny cez HTTP (ESP nevie TLS).

# ─────────────────────────────── HTTP (port 80) ───────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name garcarzp.online www.garcarzp.online 35.209.172.238 _;

    client_max_body_size 200k;
    gzip on;

    # ESP upload - vzdy cez HTTP (ziadne presmerovanie pre tento endpoint)
    location = /solar/api/esp/battery {
        proxy_pass http://127.0.0.1:8000/api/esp/battery;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /solar {
        return 301 /solar/;
    }

    location /solar/ {
        if ($host = garcarzp.online) { return 301 https://$host$request_uri; }
        if ($host = www.garcarzp.online) { return 301 https://$host$request_uri; }
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Vsetko ostatne (aj HUB a /cappytools) -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────── HTTPS (port 443) ─────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name garcarzp.online www.garcarzp.online 35.209.172.238 _;

    ssl_certificate /etc/letsencrypt/live/garcarzp.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/garcarzp.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    client_max_body_size 200k;
    gzip on;

    # HUB dashboard - staticky obsah
    root /home/patrik/server;
    index index.html;

    location = /cappytools {
        return 301 /cappytools/;
    }

    location /cappytools/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /cappytools;
        client_max_body_size 2g;
        proxy_read_timeout 300s;
    }

    location = /drive {
        return 301 /drive/;
    }

    location /drive/ {
        proxy_pass http://127.0.0.1:5050/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /drive;
        client_max_body_size 2g;
        proxy_read_timeout 300s;
    }

    location = /paste {
        return 301 /paste/;
    }

    location /paste/ {
        proxy_pass http://127.0.0.1:5060/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /paste;
        client_max_body_size 12m;
    }

    location /p/ {
        proxy_pass http://127.0.0.1:5060/p/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }

    location /api/paste {
        proxy_pass http://127.0.0.1:5060/api/paste;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }

    location = /api/system-status {
        proxy_pass http://127.0.0.1:5070/api/system-status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
    }

    # ── BrainDump ──────────────────────────────────────────────
    location = /braindump {
        return 301 /braindump/;
    }

    location /braindump/ {
        alias /home/patrik/server/BrainDump/frontend/;
        try_files $uri $uri/ /braindump/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /braindump/api/ {
        proxy_pass http://127.0.0.1:5090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /ig {
        return 301 /ig/;
    }

    location /ig/ {
        proxy_pass http://127.0.0.1:5080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /ig;
        client_max_body_size 500m;
        proxy_read_timeout 300s;
    }

    location /api/ig-tracker {
        proxy_pass http://127.0.0.1:5080/api/ig-tracker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500m;
        proxy_read_timeout 300s;
    }

    location = /solar {
        return 301 /solar/;
    }

    location /solar/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── CloakHub Link Cloaking & Bio Engine ─────────────────────
    location = /cloak {
        return 301 /cloak/;
    }

    location /cloak/ {
        proxy_pass http://127.0.0.1:5100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /cloak;
        proxy_read_timeout 30s;
    }

    location /l/ {
        proxy_pass http://127.0.0.1:5100/l/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
