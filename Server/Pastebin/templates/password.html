<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chránené heslom – PasteBin</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="header">
    <div class="header-left">
      <a href="/" class="back-link" title="Návrat do GarcArzP HUB">
        <i class="fas fa-arrow-left"></i> HUB
      </a>
      <a href="{{ url_for('index') }}" class="brand">
        <div class="brand-icon"><i class="fas fa-shield-halved"></i></div>
        <span class="brand-name">PasteBin</span>
      </a>
    </div>
  </header>

  <main class="main-content center-card-wrapper">
    <div class="center-card">
      <div class="center-card-icon icon-lock">
        <i class="fas fa-lock"></i>
      </div>
      <h1 class="center-card-title">Chránený záznam</h1>
      <p class="center-card-desc">Tento paste (<b>#{{ paste_id }}</b>) je chránený heslom. Pre zobrazenie obsahu zadajte správne heslo.</p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for m in messages %}
            <div style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #f87171; padding: 10px; border-radius: 6px; font-size: 0.88em; margin-bottom: 16px;">
              {{ m }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth_paste', paste_id=paste_id) }}" style="display: flex; flex-direction: column; gap: 14px;">
        <input type="password" name="password" class="option-input" placeholder="Zadaj heslo..." required autofocus style="width: 100%; padding: 12px 16px; font-size: 1em;">
        <button type="submit" class="btn-submit" style="width: 100%; justify-content: center; padding: 12px;">
          <i class="fas fa-key"></i> Odomknúť obsah
        </button>
      </form>
    </div>
  </main>

</body>
</html>
