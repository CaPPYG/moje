# Solar monitor - nginx reverse proxy
# Pozor: certbot vygeneroval certifikat pre garcarzp.online/www.
# Port 80:
#   - /solar/api/esp/battery je VZDY dostupny cez HTTP (ESP nevie TLS / nenasleduje redirect)
#   - ostatne /solar/ pre domeny sa presmeruju na HTTPS; cez IP sa proxy-uje na Flask
# Port 443: dashboard cez HTTPS.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name garcarzp.online www.garcarzp.online 35.209.172.238 _;

    client_max_body_size 200k;
    gzip on;

    # ESP upload - vzdy cez HTTP (ziadne presmerovanie pre tento endpoint)
    location = /solar/api/esp/battery {
        proxy_pass http://127.0.0.1:8000/api/esp/battery;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /solar {
        return 301 /solar/;
    }

    location /solar/ {
        if ($host = garcarzp.online) { return 301 https://$host$request_uri; }
        if ($host = www.garcarzp.online) { return 301 https://$host$request_uri; }
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name garcarzp.online www.garcarzp.online 35.209.172.238 _;

    ssl_certificate /etc/letsencrypt/live/garcarzp.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/garcarzp.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    client_max_body_size 200k;
    gzip on;

    location = /solar {
        return 301 /solar/;
    }
    location /solar/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
